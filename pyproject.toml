[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "stylesphere-evaluation"
version = "0.1.0"
description = "Auditable local model evaluation for four fashion business tasks"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "scipy>=1.12,<2", "PyYAML>=6,<7", "Pillow>=10,<13", "matplotlib>=3.8,<4"]

[project.scripts]
stylesphere = "stylesphere.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
